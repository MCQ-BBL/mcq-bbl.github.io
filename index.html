<!doctype html>
<html lang="km"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d5e7a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<title>BBL Exit Exam Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow study column (max 720px); home = progress summary → domain list; study = sticky progress bar → question card → answer buttons */
:root{
  --bg:#eef2f4; --surface:#ffffff; --surface-2:#f6f8f9; --ink:#14232c; --muted:#5b6b75; --line:#d5dde2;
  --accent:#1d5e7a; --accent-ink:#ffffff; --accent-soft:#dcebf2;
  --good:#1d7a4a; --good-soft:#dff3e7; --bad:#b3263a; --bad-soft:#fbe3e6; --warn:#a86a07; --warn-soft:#fbefd9;
  --img-filter:none; --img-blend:multiply;
  --f-ui:"Kantumruy Pro","Khmer OS System","Noto Sans Khmer",system-ui,sans-serif;
  --f-num:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f171c; --surface:#17222a; --surface-2:#1d2a33; --ink:#e3ebef; --muted:#93a4ae; --line:#2b3a44;
  --accent:#5fb3d6; --accent-ink:#06212d; --accent-soft:#1b3644;
  --good:#5cc98e; --good-soft:#163527; --bad:#f07c8c; --bad-soft:#3d1c23; --warn:#e8b14f; --warn-soft:#3a2d14;
  --img-filter:invert(1) brightness(.92); --img-blend:screen; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f171c; --surface:#17222a; --surface-2:#1d2a33; --ink:#e3ebef; --muted:#93a4ae; --line:#2b3a44;
  --accent:#5fb3d6; --accent-ink:#06212d; --accent-soft:#1b3644;
  --good:#5cc98e; --good-soft:#163527; --bad:#f07c8c; --bad-soft:#3d1c23; --warn:#e8b14f; --warn-soft:#3a2d14;
  --img-filter:invert(1) brightness(.92); --img-blend:screen; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:var(--f-ui);font-size:15px;line-height:1.6;padding-inline:16px;padding-block:env(safe-area-inset-top,0px) calc(48px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:720px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:20px 8px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.brand h1{font-size:22px;font-weight:700;line-height:1.3}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.sync b{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
.sync.on b{background:var(--good)}

/* summary */
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:16px;margin-top:8px}
.bigrow{display:flex;flex-wrap:wrap;gap:20px 28px;align-items:flex-end}
.big{display:flex;flex-direction:column}
.big .v{font-family:var(--f-num);font-size:30px;font-weight:700;line-height:1}
.big .l{font-size:12.5px;color:var(--muted);margin-top:6px}
.big.due .v{color:var(--warn)}
.stack{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--surface-2)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;background:var(--c);vertical-align:-1px}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 16px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent}

/* domains */
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin:28px 0 10px;gap:12px}
.sec-h h2{font-size:16px}
.sec-h span{font-size:12.5px;color:var(--muted)}
.domains{display:grid;gap:8px}
.dom{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center}
.dom .t{min-width:0}
.dom .t b{display:block;font-weight:600;line-height:1.35}
.dom .t span{font-size:12.5px;color:var(--muted)}
.dom .meta{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
.dom .meta .num{color:var(--ink);font-size:14px;font-weight:700}
.dom .stack{grid-column:1/-1;height:6px}
.dom .acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:4px 12px;font-size:13px}
.chip.due{border-color:var(--warn);color:var(--warn);background:var(--warn-soft)}
.chip:disabled{opacity:.45;cursor:default}

.settings{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:13px;color:var(--muted);margin-top:14px}
.settings select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
.note{font-size:12.5px;color:var(--muted);margin-top:22px;line-height:1.7}

/* study */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 10px;display:grid;gap:8px}
.bar-row{display:flex;align-items:center;gap:10px;justify-content:space-between}
.bar-row .btn{white-space:nowrap;flex:none}
.bar-row .lbl{flex:1;font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prog{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .25s}
.timer{font-family:var(--f-num);font-weight:700;font-size:14px}
.timer.low{color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;margin-top:6px}
.qmeta{display:flex;flex-wrap:wrap;gap:6px 10px;font-size:12px;color:var(--muted);margin-bottom:10px}
.tag{border-radius:4px;padding:1px 8px;background:var(--surface-2);border:1px solid var(--line)}
.tag.again{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.tag.new{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.stem{font-size:17px;font-weight:600;line-height:1.6;overflow-wrap:anywhere}
.content img{display:block;max-width:100%;height:auto;filter:var(--img-filter);mix-blend-mode:var(--img-blend)}
.opts{display:grid;gap:8px;margin-top:16px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;line-height:1.55;overflow-wrap:anywhere}
.opt .k{font-family:var(--f-num);font-weight:700;font-size:13px;width:26px;height:26px;border-radius:6px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.opt .content{min-width:0;padding-top:1px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--good);background:var(--good-soft)}
.opt.correct .k{background:var(--good);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:var(--surface)}
.opt.picked{border-color:var(--accent);background:var(--accent-soft)}
.feedback{margin-top:14px;font-weight:600;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.feedback .msg.ok{color:var(--good)} .feedback .msg.no{color:var(--bad)}
.nav{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap}
.kbd{font-size:12px;color:var(--muted)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}

/* results */
.res{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-top:20px;display:grid;gap:16px}
.score{font-family:var(--f-num);font-size:44px;font-weight:700;line-height:1}
.score.pass{color:var(--good)} .score.fail{color:var(--bad)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.tbl{overflow-x:auto}
.jump{display:flex;gap:6px;align-items:center}
.jump{flex:none}
.jump input{width:64px;font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
@media (max-width:480px){.stem{font-size:16px}.big .v{font-size:26px}.card{padding:14px}}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:inherit;text-decoration:underline;text-underline-offset:3px}
.auth{max-width:440px}
.auth form{display:grid;gap:6px}
.auth label{font-weight:600;font-size:14px;margin-top:8px}
.auth input{font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.auth input:focus{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:12px;color:var(--muted)}
.err{color:var(--bad);font-size:13.5px;min-height:1.4em;margin-top:4px}
.auth .btn{justify-content:center;margin-top:4px}
.tabs{display:flex;gap:4px;background:var(--surface-2);border-radius:8px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;border-radius:6px;padding:8px;font-weight:600;color:var(--muted)}
.tabs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sync{white-space:normal;text-align:right}
</style>

</head><body>
<div class="wrap" id="app"><div class="loading">កំពុងផ្ទុក…</div></div>

<script>
(()=>{
const KN='០១២៣៤៥៦៧៨៩';const kn=n=>String(n).replace(/\d/g,d=>KN[d]);
const LET=['ក','ខ','គ','ឃ','ង','ច'];
const INTERVALS=[0,1,3,7,16,35]; // days, Leitner boxes 0..5
const MASTER=4;
const today=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*60000)/86400000)};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

let META=[];const DATA={};
async function loadDomain(id){
  if(DATA[id])return DATA[id];
  const r=await fetch(id+'.json');DATA[id]=await r.json();return DATA[id];
}

/* ---------- progress store: localStorage (per user) + Supabase ---------- */
const SUPABASE_URL='__SUPABASE_URL__';
const SUPABASE_KEY='__SUPABASE_KEY__';
const EMAIL_DOMAIN='@mcqbbl.app';
let sb=null;try{if(window.supabase&&!SUPABASE_URL.startsWith('__'))sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY)}catch(e){}
const Store={prog:{},stats:{},settings:{newPerDay:60,round:20},uid:null,username:null,online:false,dirty:new Set(),timer:null,writing:false,ns:'guest',
  key(k){return 'bbl_'+this.ns+'_'+k},
  loadLocal(){this.prog=LS.get(this.key('prog'),{});this.stats=LS.get(this.key('stats'),{});
    this.settings={newPerDay:60,round:20,...LS.get(this.key('settings'),{})}},
  saveLocal(){LS.set(this.key('prog'),this.prog);LS.set(this.key('stats'),this.stats);LS.set(this.key('settings'),this.settings)},
  async session(){if(!sb)return null;try{const {data}=await sb.auth.getSession();return data.session}catch(e){return null}},
  async useSession(s){
    this.uid=s.user.id;this.username=(s.user.user_metadata&&s.user.user_metadata.username)||s.user.email.replace(EMAIL_DOMAIN,'');
    this.ns=this.uid;this.loadLocal();await this.pull();
  },
  useGuest(){this.uid=null;this.username=null;this.ns='guest';this.online=false;this.loadLocal();LS.set('bbl_mode','guest')},
  async pull(){
    try{
      const {data,error}=await sb.from('progress').select('k,data').eq('user_id',this.uid);
      if(error)throw error;
      const rows={};(data||[]).forEach(r=>rows[r.k]=r.data||{});
      META.forEach(m=>{const id=m.id;const rp=(rows[id]||{}).p||{};const lp=this.prog[id]||(this.prog[id]={});
        for(const k in rp){const a=rp[k],b=lp[k];if(!b||(a[2]+a[3])>(b[2]+b[3]))lp[k]=a}
        for(const k in lp){if(!rp[k]||(lp[k][2]+lp[k][3])>(rp[k][2]+rp[k][3])){this.dirty.add(id);break}}});
      if(rows.stats){const rs=rows.stats.d||{};for(const k in rs){const a=rs[k],b=this.stats[k];if(!b||a[0]>b[0])this.stats[k]=a}
        if(rows.stats.settings)Object.assign(this.settings,rows.stats.settings)}
      this.dirty.add('stats');this.online=true;this.saveLocal();this.flushSoon(500);
    }catch(e){console.warn('sync failed',e);this.online=false}
  },
  entry(d,i){return (this.prog[d]||{})[i]},
  record(d,i,ok){
    const p=this.prog[d]||(this.prog[d]={});const t=today();
    let e=p[i]?p[i].slice():[0,t,0,0];
    if(ok){e[0]=Math.min(5,e[0]+1);e[2]++}else{e[0]=1;e[3]++}
    e[1]=t+INTERVALS[e[0]];p[i]=e;
    const s=this.stats[t]||(this.stats[t]=[0,0]);s[0]++;if(ok)s[1]++;
    this.saveLocal();this.dirty.add(d);this.dirty.add('stats');this.flushSoon();
  },
  saveSettings(){this.saveLocal();this.dirty.add('stats');this.flushSoon()},
  flushSoon(ms=2500){clearTimeout(this.timer);this.timer=setTimeout(()=>this.flush(),ms)},
  async flush(){
    if(!sb||!this.uid||this.writing||!this.dirty.size)return;
    this.writing=true;const items=[...this.dirty];this.dirty.clear();
    const rows=items.map(k=>{
      if(k==='stats'){const keep={};Object.keys(this.stats).map(Number).sort((a,b)=>b-a).slice(0,400).forEach(d=>keep[d]=this.stats[d]);
        return {user_id:this.uid,k:'stats',data:{d:keep,settings:this.settings}}}
      return {user_id:this.uid,k,data:{p:this.prog[k]||{}}}});
    try{const {error}=await sb.from('progress').upsert(rows);if(error)throw error;if(!this.online){this.online=true;syncBadge()}}
    catch(e){items.forEach(k=>this.dirty.add(k));if(this.online){this.online=false;syncBadge()}}
    this.writing=false;if(this.dirty.size)this.flushSoon(8000);
  }
};
window.addEventListener('pagehide',()=>{Store.flush()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')Store.flush()});

function domainCounts(d){
  const m=META.find(x=>x.id===d);const p=Store.prog[d]||{};const t=today();
  let mastered=0,learning=0,due=0,wrong=0,right=0;
  for(const k in p){const e=p[k];if(e[0]>=MASTER)mastered++;else learning++;if(e[1]<=t)due++;right+=e[2];wrong+=e[3]}
  return {n:m.n,mastered,learning,unseen:m.n-mastered-learning,due,acc:(right+wrong)?right/(right+wrong):null,wrongEver:Object.values(p).filter(e=>e[3]>0).length};
}
function totals(){
  const t={n:0,mastered:0,learning:0,unseen:0,due:0};
  META.forEach(m=>{const c=domainCounts(m.id);for(const k in t)t[k]+=c[k]});return t;
}
function newToday(){const s=Store.stats[today()];return s?s[0]:0}
function streak(){let n=0,d=today();if(!Store.stats[d])d--;while(Store.stats[d]){n++;d--}return n}

/* ---------- views ---------- */
let view='home', S=null; // S = session state

function syncBadge(){const el=$('#sync');if(!el)return;el.className='sync'+(Store.online?' on':'');
  el.innerHTML=Store.uid?`<b></b>${esc(Store.username)} · <button class="linkbtn" id="logout">ចេញពីគណនី</button>`
    :(sb?`<b></b>មិនបានចូលគណនី · <button class="linkbtn" id="tologin">ចូលគណនី</button>`:'<b></b>រក្សាទុកក្នុងឧបករណ៍នេះ');
  const lo=$('#logout');lo&&(lo.onclick=async()=>{await Store.flush();try{await sb.auth.signOut()}catch(e){}LS.set('bbl_mode','');Store.useGuest();LS.set('bbl_mode','');view='login';render()});
  const tl=$('#tologin');tl&&(tl.onclick=()=>{view='login';render()});}

function stackBar(c){
  const w=x=>(100*x/c.n).toFixed(2)+'%';
  return `<div class="stack" aria-hidden="true"><i style="width:${w(c.mastered)};background:var(--good)"></i><i style="width:${w(c.learning)};background:var(--accent)"></i></div>`;
}
function renderHome(){
  const T=totals(),todayStats=Store.stats[today()]||[0,0];
  const pct=Math.round(100*T.mastered/T.n);
  $('#app').innerHTML=`
  <header class="top"><div class="brand"><small>BBL · MoH Exit Exam · ${kn(T.n)} សំណួរ</small><h1>ហាត់ប្រឡងបញ្ចប់ការសិក្សា</h1></div><div class="sync" id="sync"></div></header>
  <section class="summary">
    <div class="bigrow">
      <div class="big"><span class="v">${pct}%</span><span class="l">ចាំបានល្អ (${T.mastered.toLocaleString()} / ${T.n.toLocaleString()})</span></div>
      <div class="big due"><span class="v">${T.due.toLocaleString()}</span><span class="l">ត្រូវរំលឹកថ្ងៃនេះ</span></div>
      <div class="big"><span class="v">${todayStats[0]}</span><span class="l">បានធ្វើថ្ងៃនេះ${todayStats[0]?` · ត្រូវ ${Math.round(100*todayStats[1]/todayStats[0])}%`:''}</span></div>
      <div class="big"><span class="v">${streak()}</span><span class="l">ថ្ងៃជាប់គ្នា</span></div>
    </div>
    ${stackBar(T)}
    <div class="legend"><span style="--c:var(--good)">ចាំបានល្អ</span><span style="--c:var(--accent)">កំពុងរៀន</span><span style="--c:var(--surface-2)">មិនទាន់ធ្វើ ${T.unseen.toLocaleString()}</span></div>
    <div class="cta">
      <button class="btn primary" id="go-today">រៀនថ្ងៃនេះ (${Math.min(Store.settings.round,T.due+Math.max(0,Store.settings.newPerDay-newToday()))||Store.settings.round} សំណួរ)</button>
      <button class="btn" id="go-mock">ប្រឡងសាកល្បង</button>
      <button class="btn ghost" id="go-wrong" ${META.some(m=>domainCounts(m.id).wrongEver)?'':'disabled'}>សំណួរដែលធ្លាប់ខុស</button>
    </div>
  </section>
  <div class="sec-h"><h2>តាម Domain</h2><span>ចុច «អាន» ដើម្បីមើលចម្លើយ · «ហាត់» ដើម្បីសាកល្បង</span></div>
  <div class="domains">${META.map((m,i)=>{const c=domainCounts(m.id);return `
    <div class="dom"><div class="t"><b>${i+1}. ${esc(m.en)}</b><span>${esc(m.kh)}</span></div>
      <div class="meta"><span class="num">${c.mastered}</span>/${c.n}${c.acc!=null?`<br>ត្រូវ ${Math.round(c.acc*100)}%`:''}</div>
      ${stackBar(c)}
      <div class="acts">

/* ---------- study / quiz ---------- */
async function buildQueue(domains,mode){
  $('#app').innerHTML='<div class="loading">កំពុងផ្ទុកសំណួរ…</div>';
  await Promise.all(domains.map(loadDomain));
  const t=today();let due=[],fresh=[],wrong=[];
  for(const d of domains){const p=Store.prog[d]||{};const n=DATA[d].length;
    for(let i=0;i<n;i++){const e=p[i];
      if(!e)fresh.push([d,i]);else{if(e[1]<=t)due.push([d,i]);if(e[3]>0)wrong.push([d,i,e])}}}
  const R=Store.settings.round;
  if(mode==='wrong'){wrong.sort((a,b)=>(a[2][0]-b[2][0])||(b[2][3]-a[2][3]));return shuffle(wrong.slice(0,R*1).map(x=>[x[0],x[1]]))}
  if(mode==='due')return shuffle(due).slice(0,R);
  // today: due first, then new (within daily limit; if limit used up, still allow new so the button always works)
  shuffle(due);shuffle(fresh);
  const room=Math.max(0,Store.settings.newPerDay-newToday());
  let q=due.slice(0,R);
  if(q.length<R)q=q.concat(fresh.slice(0,Math.max(R-q.length,0)).slice(0,room||R-q.length));
  return q;
}
async function startStudy(domains,mode){
  const q=await buildQueue(domains,mode);
  if(!q.length){view='home';render();return}
  S={kind:'study',domains,mode,queue:q,pos:0,answered:null,right:0,wrong:0,requeued:new Set(),log:[]};
  view='quiz';render();
}
function mockSetup(){
  view='mocksetup';
  $('#app').innerHTML=`<header class="top"><div class="brand"><small>ប្រឡងសាកល្បង</small><h1>ជ្រើសចំនួនសំណួរ</h1></div></header>
  <section class="summary"><p style="margin:0">សំណួរត្រូវបានជ្រើសដោយចៃដន្យពីគ្រប់ Domain តាមសមាមាត្រនៃចំនួនសំណួរ។ មិនបង្ហាញចម្លើយរហូតដល់ចប់ ហើយកំណត់ពេល ១ នាទីក្នុងមួយសំណួរ។</p>
  <div class="cta">${[50,100,150].map(n=>`<button class="btn ${n==100?'primary':''}" data-n="${n}">${n} សំណួរ · ${n} នាទី</button>`).join('')}
  <button class="btn ghost" id="back">ត្រលប់</button></div></section>`;
  document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>startMock(+b.dataset.n));
  $('#back').onclick=()=>{view='home';render()};
}
async function startMock(n){
  const ids=META.map(m=>m.id);
  $('#app').innerHTML='<div class="loading">កំពុងផ្ទុកសំណួរទាំង ៨ Domain…</div>';
  await Promise.all(ids.map(loadDomain));
  const total=META.reduce((a,m)=>a+m.n,0);let q=[];
  META.forEach((m,k)=>{let take=Math.round(n*m.n/total);if(k===META.length-1)take=n-q.length;
    q=q.concat(shuffle([...Array(m.n).keys()]).slice(0,Math.max(0,take)).map(i=>[m.id,i]))});
  S={kind:'mock',queue:shuffle(q),pos:0,picks:{},end:Date.now()+n*60000,done:false};
  view='quiz';render();tick();
}
function tick(){
  if(!S||S.kind!=='mock'||S.done)return;
  const left=Math.max(0,S.end-Date.now());const el=$('#timer');
  if(el){const m=Math.floor(left/60000),s=Math.floor(left/1000)%60;el.textContent=`${m}:${String(s).padStart(2,'0')}`;el.classList.toggle('low',left<300000)}
  if(left<=0){finishMock();return}
  setTimeout(tick,1000);
}
function domName(d){const m=META.find(x=>x.id===d);return m?m.en:d}

function renderQuiz(){
  const [d,i]=S.queue[S.pos];const Q=DATA[d][i];const e=Store.entry(d,i);
  const mock=S.kind==='mock';const n=S.queue.length;
  const picked=mock?S.picks[S.pos]:S.answered;
  const tag=mock?'':(!e?'<span class="tag new">ថ្មី</span>':e[3]>0?`<span class="tag again">ធ្លាប់ខុស ${e[3]} ដង</span>`:`<span class="tag">ប្រអប់ ${e[0]}</span>`);
  const optCls=k=>{
    if(mock)return picked===k?'picked':'';
    if(picked==null)return '';
    if(k===Q.a)return 'correct';if(k===picked)return 'wrong';return '';
  };
  $('#app').innerHTML=`
  <div class="bar">
    <div class="bar-row"><button class="btn ghost" id="quit" style="padding:6px 12px">✕ ចេញ</button>
      <span class="lbl num">${S.pos+1} / ${n}${mock?'':` · ត្រូវ ${S.right} · ខុស ${S.wrong}`}</span>
      ${mock?'<span class="timer" id="timer"></span>':'<span></span>'}</div>
    <div class="prog"><i style="width:${100*(S.pos+(picked!=null&&!mock?1:0))/n}%"></i></div>
  </div>
  <article class="card">
    <div class="qmeta"><span class="tag">${esc(domName(d))}</span>${tag}</div>
    <div class="stem">${content(Q.q)}</div>
    <div class="opts">${Q.o.map((o,k)=>`<button class="opt ${optCls(k)}" data-k="${k}" ${(!mock&&picked!=null)?'disabled':''}><span class="k">${LET[k]||k+1}</span>${content(o)}</button>`).join('')}</div>
    ${(!mock&&picked!=null)?`<div class="feedback"><span class="msg ${picked===Q.a?'ok':'no'}">${picked===Q.a?'✓ ត្រឹមត្រូវ':'✗ មិនត្រឹមត្រូវ · ចម្លើយគឺ '+(LET[Q.a])}</span><button class="btn primary" id="next">${S.pos+1<n?'បន្ទាប់ →':'មើលលទ្ធផល'}</button></div>`:''}
    ${mock?`<div class="nav"><button class="btn" id="prev" ${S.pos?'':'disabled'}>← មុន</button><span class="kbd">${Object.keys(S.picks).length} / ${n} បានឆ្លើយ</span>${S.pos+1<n?'<button class="btn primary" id="mnext">បន្ទាប់ →</button>':'<button class="btn primary" id="submit">ដាក់ចម្លើយ</button>'}</div>`:''}
  </article>
  <p class="kbd" style="margin-top:12px">ក្តារចុច៖ 1–${Q.o.length} ជ្រើសចម្លើយ · Enter បន្ទាប់</p>`;
  if(mock)tick();
  $('#quit').onclick=()=>{if(mock&&!S.confirmQuit){S.confirmQuit=true;$('#quit').textContent='ចុចម្តងទៀតដើម្បីចេញ';return}S=null;view='home';render()};
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(+b.dataset.k));
  const nx=$('#next');if(nx){nx.onclick=next;nx.focus({preventScroll:true})}
  if(mock){const p=$('#prev');p&&(p.onclick=()=>{S.pos--;render()});const m=$('#mnext');m&&(m.onclick=()=>{S.pos++;render()});const sb=$('#submit');sb&&(sb.onclick=()=>{
    const left=n-Object.keys(S.picks).length;if(left&&!S.confirmSubmit){S.confirmSubmit=true;sb.textContent=`នៅសល់ ${left} មិនទាន់ឆ្លើយ · ចុចម្តងទៀត`;return}finishMock()})}
}
function choose(k){
  const [d,i]=S.queue[S.pos];const Q=DATA[d][i];
  if(S.kind==='mock'){S.picks[S.pos]=k;render();return}
  if(S.answered!=null)return;
  S.answered=k;const ok=k===Q.a;
  if(ok)S.right++;else{S.wrong++;const key=d+':'+i;if(!S.requeued.has(key)){S.requeued.add(key);S.queue.splice(Math.min(S.queue.length,S.pos+6),0,[d,i])}}
  S.log.push([d,i,ok]);
  Store.record(d,i,ok);render();
}
function next(){
  if(S.answered==null)return;
  S.answered=null;
  if(S.pos+1>=S.queue.length){view='done';render();return}
  S.pos++;render();window.scrollTo({top:0});
}
function finishMock(){
  S.done=true;
  S.queue.forEach(([d,i],p)=>{if(S.picks[p]!=null)Store.record(d,i,S.picks[p]===DATA[d][i].a)});
  view='done';render();
}
function renderDone(){
  let rows='',right=0,total=S.queue.length,wrongList=[];
  const by={};
  if(S.kind==='mock'){S.queue.forEach(([d,i],p)=>{const ok=S.picks[p]===DATA[d][i].a;(by[d]=by[d]||[0,0])[0]++;if(ok){by[d][1]++;right++}else wrongList.push([d,i])})}
  else{const seen=new Map();S.log.forEach(([d,i,ok])=>{const k=d+':'+i;if(!seen.has(k))seen.set(k,[d,i,ok])});
    seen.forEach(([d,i,ok])=>{(by[d]=by[d]||[0,0])[0]++;if(ok){by[d][1]++;right++}else wrongList.push([d,i])});total=seen.size}
  const pct=total?Math.round(100*right/total):0;
  rows=Object.keys(by).map(d=>`<tr><td>${esc(domName(d))}</td><td class="r num">${by[d][1]}/${by[d][0]}</td><td class="r num">${Math.round(100*by[d][1]/by[d][0])}%</td></tr>`).join('');
  $('#app').innerHTML=`<header class="top"><div class="brand"><small>${S.kind==='mock'?'លទ្ធផលប្រឡងសាកល្បង':'ចប់ជុំនេះ'}</small><h1>${S.kind==='mock'?(pct>=50?'ល្អណាស់ បន្តទៀត':'ត្រូវរំលឹកបន្ថែម'):'ធ្វើបានល្អ'}</h1></div></header>
  <section class="res">
    <div class="bigrow"><div class="big"><span class="score num ${pct>=50?'pass':'fail'}">${pct}%</span><span class="l">ត្រូវ ${right} / ${total}${S.kind==='study'?' (ការឆ្លើយលើកដំបូង)':''}</span></div></div>
    <div class="tbl"><table><thead><tr><th>Domain</th><th class="r">ត្រូវ</th><th class="r">%</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="cta">
      ${S.kind==='study'?'<button class="btn primary" id="again">ជុំបន្ទាប់</button>':''}
      ${wrongList.length?`<button class="btn" id="review">មើលសំណួរខុស (${wrongList.length})</button>`:''}
      <button class="btn ghost" id="home">ទំព័រដើម</button></div>
  </section>`;
  $('#home').onclick=()=>{S=null;view='home';render()};
  const a=$('#again');a&&(a.onclick=()=>startStudy(S.domains,S.mode==='wrong'?'wrong':S.mode));
  const r=$('#review');r&&(r.onclick=()=>{R={list:wrongList,pos:0,title:'សំណួរដែលខុស'};view='read';render()});
}

      showErr(m.includes('already')?'ឈ្មោះនេះមានគេប្រើហើយ។ សូមជ្រើសឈ្មោះផ្សេង ឬចូលគណនីវិញ។'
        :m.includes('invalid login')?'ឈ្មោះអ្នកប្រើ ឬពាក្យសម្ងាត់មិនត្រឹមត្រូវ។'
        :m.includes('rate')?'ព្យាយាមញឹកពេក។ សូមរង់ចាំបន្តិចសិន។'
        :'មានបញ្ហា៖ '+(e&&e.message||'មិនស្គាល់'));
      b.disabled=false;b.textContent=mode==='in'?'ចូល':'បង្កើតគណនី';
    }
  };
  function showErr(t){$('#err').textContent=t}
}

function render(){
  if(view==='login')return renderLogin();
  if(view==='home')renderHome();else if(view==='quiz')renderQuiz();else if(view==='done')renderDone();else if(view==='read')renderRead();
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  if(view==='quiz'&&S){
    const n=parseInt(e.key,10);
    if(n>=1&&n<=6){const [d,i]=S.queue[S.pos];if(n<=DATA[d][i].o.length){e.preventDefault();choose(n-1)}}
    else if(e.key==='Enter'){e.preventDefault();if(S.kind==='mock'){if(S.pos+1<S.queue.length){S.pos++;render()}}else next()}
  }else if(view==='read'&&R){
    if(e.key==='ArrowRight'&&R.pos+1<R.list.length){R.pos++;render()}
    if(e.key==='ArrowLeft'&&R.pos>0){R.pos--;render()}
  }
});

(async()=>{
  try{META=await (await fetch('meta.json')).json()}catch(e){$('#app').innerHTML='<div class="loading">មិនអាចផ្ទុកសំណួរបានទេ។ សូមបើកទំព័រនេះម្តងទៀត។</div>';return}
  const ses=await Store.session();
  if(ses){await Store.useSession(ses);view='home'}
  else if(LS.get('bbl_mode','')==='guest'){Store.useGuest();view='home'}
  else{Store.useGuest();view=sb?'login':'home'}
  render();
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
})();
</script>
